spring:
  application:
    name: muster
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:muster}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 8080
  tomcat:
    # 超限上传时把请求体读完再回 413 JSON，否则连接会被提前掐断，客户端收不到响应
    max-swallow-size: -1

muster:
  jwt-secret: ${JWT_SECRET:muster-dev-secret-0123456789abcdef0123456789abcdef}
  form-base-url: ${FORM_BASE_URL:http://localhost:5173}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health
