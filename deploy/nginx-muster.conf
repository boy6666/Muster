# Muster 点将台 · 本机 nginx 反代模板（远端 Win10 服务器同样用法）
# 用法：放到 nginx 的 conf 目录，并在 nginx.conf 的 http{} 末尾加一行：
#   include D:/software/nginx-1.22.0-web/conf/muster.conf;
# 127.0.0.1:8091 仅本机：整体转发到 compose 前端容器（HTTP_PORT=8092，BIND_ADDR=127.0.0.1），
# 容器内 nginx 已负责静态托管 + /api 反代 + /ws WebSocket 升级
# Cloudflare Tunnel 出站拉到 8091，对外走 https（nginx 本身保持 HTTP）
server {
    listen       127.0.0.1:8091;
    server_name  _;
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 实时统计 WebSocket /ws/stats：透传升级头，长连接不超时
    location /ws/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}
